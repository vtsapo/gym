<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Logbook Επιστροφής</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@500;600;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one-column gym logbook, phone first; sticky top bar, fixed bottom tab bar; phases colored like competition plates (10 green, 15 yellow, 20 blue, 25 red). */
:root{
  --bg:#EDEFF1; --card:#FFFFFF; --ink:#14181D; --muted:#5D6670; --line:#D6DADF; --soft:#E3E6EA;
  --accent:#1D57C9; --accent-ink:#FFFFFF; --good:#1F8A4C; --warn:#B7791F; --bad:#C2362B;
  --p-green:#2E9E57; --p-yellow:#E0B020; --p-blue:#1D57C9; --p-red:#D23A2E; --p-grey:#8D96A0;
  --f-display:"Fira Sans Condensed","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101317; --card:#181C22; --ink:#E9ECEF; --muted:#9AA3AD; --line:#2A3038; --soft:#20252C;
  --accent:#5B8DF0; --accent-ink:#0B1220; --good:#4CC27F; --warn:#E3B34F; --bad:#F0675B;
  --p-green:#43B96F; --p-yellow:#E8C04A; --p-blue:#5B8DF0; --p-red:#EE5D50; --p-grey:#7C8590; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101317; --card:#181C22; --ink:#E9ECEF; --muted:#9AA3AD; --line:#2A3038; --soft:#20252C;
  --accent:#5B8DF0; --accent-ink:#0B1220; --good:#4CC27F; --warn:#E3B34F; --bad:#F0675B;
  --p-green:#43B96F; --p-yellow:#E8C04A; --p-blue:#5B8DF0; --p-red:#EE5D50; --p-grey:#7C8590; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:22px;font-weight:800;letter-spacing:.2px}
h2{font-size:22px;font-weight:800}
h3{font-size:18px;font-weight:600}
p{margin:0}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding-block:6px 4px}
.plate{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:600;font-size:14px;padding:3px 10px 3px 4px;border-radius:999px;background:var(--soft)}
.plate i{width:16px;height:16px;border-radius:50%;border:4px solid currentColor;display:inline-block}
.c-green{color:var(--p-green)}.c-yellow{color:var(--p-yellow)}.c-blue{color:var(--p-blue)}.c-red{color:var(--p-red)}.c-grey{color:var(--p-grey)}
.plate span{color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:600 14px var(--f-display);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-left:6px;vertical-align:middle}
button{font:inherit}
.btn{border:0;border-radius:10px;padding:11px 14px;font:600 15px var(--f-display);letter-spacing:.02em;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn:focus-visible,.chip:focus-visible,.tick:focus-visible,input:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.today-hero{display:grid;gap:8px}
.focusnote{border-left:0;background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px}
.ex{display:grid;gap:10px}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ex-head > div{min-width:0}
.ex-name{font-family:var(--f-display);font-weight:600;font-size:19px;line-height:1.15}
.ex-en{font-size:12.5px;color:var(--muted)}
.rx{font-family:var(--f-display);font-weight:600;font-size:16px;white-space:nowrap;text-align:right}
.rx small{display:block;font:500 12px var(--f-body);color:var(--muted)}
.sugg{font-size:13.5px;background:var(--soft);border-radius:8px;padding:7px 10px}
.sugg b{font-family:var(--f-display);font-size:15px}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:30px 1fr 1fr 46px;gap:6px;align-items:center}
.set label{font:600 13px var(--f-display);color:var(--muted)}
.set input{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:9px 8px;font:600 17px var(--f-display);font-variant-numeric:tabular-nums;text-align:center}
.set input::placeholder{color:var(--muted);opacity:.6}
.tick{height:42px;border-radius:9px;border:1.5px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;font:800 18px var(--f-display)}
.tick[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.set.done input{border-color:color-mix(in srgb,var(--good) 45%,var(--line))}
.colhdr{display:grid;grid-template-columns:30px 1fr 1fr 46px;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:center}
.cue{font-size:13.5px;color:var(--muted)}
.cue strong{color:var(--ink);font-weight:600}
.backtip{font-size:13px;color:var(--warn)}
.links{display:flex;gap:12px;font-size:13px}
.links a{color:var(--accent);text-decoration:none;font-weight:500}
.addset{background:none;border:1px dashed var(--line);color:var(--muted);border-radius:8px;padding:6px;font:600 13px var(--f-display);cursor:pointer}
.simple{display:flex;justify-content:space-between;gap:10px;align-items:center}
.simple > div{min-width:0}
.warm li{margin:3px 0}
ul{margin:6px 0 0;padding-left:18px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px}
.tile .v{font:800 26px var(--f-display);font-variant-numeric:tabular-nums;line-height:1}
.tile .l{font-size:12px;color:var(--muted);margin-top:4px}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.timeline{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.wk{height:30px;border-radius:5px;display:grid;place-items:center;font:600 12px var(--f-display);color:#fff;opacity:.45}
.wk.past{opacity:.8}.wk.now{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.bg-green{background:var(--p-green)}.bg-yellow{background:var(--p-yellow);color:#2a2200}.bg-blue{background:var(--p-blue)}.bg-red{background:var(--p-red)}.bg-grey{background:var(--p-grey)}
.phase{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.phase > div{min-width:0}
table{border-collapse:collapse;width:100%;font-size:14px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.tscroll{overflow-x:auto}
select,.field{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:9px 10px;font:500 15px var(--f-body);max-width:100%}
.field{width:100%}
.chart svg{display:block;width:100%;height:auto}
.pr{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.pr > div{min-width:0}
.badge{font:600 11px var(--f-display);text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:99px;background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.light{display:grid;grid-template-columns:14px 1fr;gap:10px;align-items:start;padding:8px 0}
.light i{width:14px;height:14px;border-radius:50%;margin-top:3px}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.scale button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:7px 0;font:600 14px var(--f-display);cursor:pointer}
.scale button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--card) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;color:var(--muted);text-decoration:none;font:600 12px var(--f-display);letter-spacing:.02em}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
.rest{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:21;background:var(--ink);color:var(--bg);border-radius:999px;padding:8px 8px 8px 16px;display:flex;gap:12px;align-items:center;font:600 16px var(--f-display);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.rest button{background:var(--bg);color:var(--ink);border:0;border-radius:999px;padding:6px 12px;font:600 13px var(--f-display);cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:30;background:var(--good);color:#fff;border-radius:10px;padding:10px 14px;font:600 15px var(--f-display);max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.status{font-size:12.5px;color:var(--muted)}
.tl{display:grid;grid-template-columns:52px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.tl:last-of-type{border-bottom:0}
.tl > div{min-width:0}
.tl-t{font-weight:800;font-size:17px;color:var(--accent)}
.pill{font:600 12px var(--f-display);padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--ink)}
.wakebtn{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:5px 10px;font:600 12px var(--f-display);cursor:pointer;white-space:nowrap}
.wakebtn[aria-pressed="true"]{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,var(--line))}
.wakebtn::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:6px;vertical-align:middle}
.empty{padding:16px;text-align:center;color:var(--muted);font-size:14px}
.seg{display:grid;grid-template-columns:1.6fr repeat(4,1fr);background:var(--soft);border-radius:11px;padding:3px;gap:3px}
.seg button{position:relative;border:0;background:transparent;color:var(--ink);border-radius:8px;padding:9px 0;font:600 15px var(--f-display);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg .nx{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.exlist{display:flex;flex-direction:column;gap:8px}
.ex{padding:0;overflow:hidden}
.exbtn{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:10px 12px;text-align:left;color:var(--ink);cursor:pointer}
.exbtn:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.exttl{display:flex;flex-direction:column;min-width:0;flex:1}
.exsub{font:500 14px var(--f-display);color:var(--muted);font-variant-numeric:tabular-nums}
.exsub b{color:var(--ink)}
.ok{color:var(--good);font-weight:600}
.isdone .ex-name{color:var(--muted)}
.chev{width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);flex:0 0 auto;margin-right:4px}
.open .chev,details[open] .chev{transform:rotate(-135deg)}
.fig{display:block;border-radius:8px;overflow:hidden;background:var(--soft);aspect-ratio:3/2;max-width:100%}
.fig img,.fig svg{display:block;width:100%;height:100%;object-fit:cover}
.fig.thumb{width:66px;flex:0 0 66px}
.exbody{display:grid;gap:12px;padding:0 12px 14px}
.frames{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.frames.three{grid-template-columns:repeat(3,1fr)}
.frames figure{margin:0;min-width:0}
.frames figcaption{font:600 12px var(--f-display);color:var(--muted);text-align:center;margin-top:3px}
.target{background:var(--soft);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.target .big{font:800 28px var(--f-display);line-height:1.1;font-variant-numeric:tabular-nums}
.tline{font-size:14px}
.why{font-size:12.5px;color:var(--muted);margin-top:4px}
.set{grid-template-columns:24px 1fr 1fr 52px}
.colhdr{grid-template-columns:24px 1fr 1fr 52px}
.sn{color:var(--muted);font-weight:600;text-align:center}
.hint{font-size:12.5px;color:var(--muted)}
.how{display:grid;gap:6px;font-size:14px;border-top:1px solid var(--line);padding-top:10px}
.exfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.exfoot a{color:var(--accent);text-decoration:none;font-size:14px;font-weight:500}
.btn.sm{padding:8px 12px;font-size:14px}
.warmcard summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;list-style:none}
.warmcard summary::-webkit-details-marker{display:none}
.warmlist{display:grid;gap:10px;margin-top:10px}
.warm-it{display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center}
.warm-it > div{min-width:0}
.focusnote{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px}
@media (prefers-reduced-motion: no-preference){.toast{animation:pop .25s ease-out}@keyframes pop{from{transform:translate(-50%,-8px);opacity:0}to{transform:translate(-50%,0);opacity:1}}}
</style>

<div class="wrap" id="app">
  <div class="header">
    <div>

const TODAY = iso(new Date());
function daysBetween(a,b){return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000);}
function weekOf(date){const d=daysBetween(state.start,date);return Math.max(1,Math.min(12,Math.floor(d/7)+1));}
function fmtDate(s){try{return new Date(s+"T12:00:00").toLocaleDateString("el-GR",{weekday:"short",day:"numeric",month:"short"});}catch(e){return s;}}
function fmtKg(n){return (Math.round(n*10)/10).toString().replace(".",",");}
function e1rm(kg,reps){if(kg==null||!reps)return null;return kg*(1+reps/30);}
function rxFor(exId, week){const e=EX[exId]; if(e.fixed) return e.fixed; return rx(e.type, week);}
function yt(q){return "https://www.youtube.com/results?search_query="+encodeURIComponent(q+" proper form");}
function lsGet(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f;}catch(e){return f;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}

/* ---------- State + storage ---------- */
const STANDALONE = !(window.claude && window.claude.use);
const state = {start:DEFAULT_START, sessions:{}, body:{}, mode:"loading", sel:null, open:null, restEnd:0};
let db=null; const dirty=new Set(); const timers={}; let chain=Promise.resolve();

function sessionsList(){return Object.entries(state.sessions).map(([id,s])=>Object.assign({id},s)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.updatedAt||0)-(b.updatedAt||0));}
function hasWork(s){return s.done || Object.values(s.entries||{}).some(arr=>arr.some(x=>x.done));}
function programSessions(){return sessionsList().filter(s=>s.date>=state.start && s.day!=="Z" && hasWork(s));}

function persist(id){
  dirty.add(id);
  clearTimeout(timers[id]);
  timers[id]=setTimeout(()=>{
    const data = JSON.parse(JSON.stringify(state.sessions[id]));
    data.updatedAt = Date.now();
    if(!db){ lsSet("gym.sessions", state.sessions); dirty.delete(id); return; }
    chain = chain.then(()=>db.collection("sessions").doc(id).set(data)).then(()=>{dirty.delete(id); setStatus();}).catch(err=>{setStatus("Δεν αποθηκεύτηκε: "+(err&&err.message||"σφάλμα σύνδεσης")+". Κράτα το κινητό ανοιχτό και ξαναδοκίμασε.");});
    lsSet("gym.sessions", state.sessions);
  },600);
}
function saveBody(date, obj){
  state.body[date]=Object.assign({}, state.body[date]||{}, obj, {date});
  lsSet("gym.body", state.body);
  if(db){ chain = chain.then(()=>db.collection("body").doc(date).set(state.body[date])).catch(()=>setStatus("Η μέτρηση δεν αποθηκεύτηκε. Ξαναδοκίμασε.")); }
}
function setStatus(msg){
  const el=$("#status");
  if(msg){el.textContent=msg;return;}
  if(state.mode==="db") el.textContent="Αποθηκεύεται αυτόματα στο λογαριασμό σου.";
  else if(state.mode==="local") el.textContent=STANDALONE?"Αποθηκεύεται σε αυτό το κινητό. Κράτα αντίγραφο από την καρτέλα Πρόοδος.":"Αποθηκεύεται μόνο σε αυτή τη συσκευή (δεν βρέθηκε σύνδεση στο λογαριασμό).";
  else el.textContent="Φόρτωση δεδομένων…";
}

/* ---------- Logic ---------- */
function lastSets(exId, excludeId){
  const list = sessionsList().filter(s=>s.id!==excludeId && s.entries && s.entries[exId] && s.entries[exId].some(x=>x.done));
  if(!list.length) return null;
  const s=list[list.length-1]; return {date:s.date, sets:s.entries[exId].filter(x=>x.done)};
}
function suggestion(exId, week, excludeId){
  const e=EX[exId], r=rxFor(exId,week); if(!r) return null;
  const last=lastSets(exId, excludeId);
  const start = START[exId]!=null? START[exId] : null;
  const withKg = last? last.sets.filter(x=>x.kg!=null) : [];
  if(!withKg.length){
    if(start==null) return {kg:null, why:"Διάλεξε κιλά που σου αφήνουν μερικές επαναλήψεις ακόμα."};
    return {kg:start, why:(last?"Την προηγούμενη δεν γράψαμε κιλά. ":"")+"Πρόταση για αρχή. Αν βγει πολύ εύκολο ή πολύ βαρύ, γράψε τα κιλά που έκανες τελικά και την επόμενη φορά προσαρμόζω."};
  }
  const kg=Math.max(...withKg.map(x=>x.kg));
  const top=withKg.filter(x=>x.kg===kg);
  const repsTxt=top.map(x=>x.reps==null?"?":x.reps).join(", ");
  const lastTxt="Την προηγούμενη ("+fmtDate(last.date)+"): "+fmtW(exId,kg)+" × "+repsTxt+". ";
  const allTop = top.length>=Math.min(r.sets, last.sets.length) && top.every(x=>(x.reps||0)>=r.hi);
  const tooHeavy = top.some(x=>x.reps!=null && x.reps < r.lo-2);
  if(phaseOf(week).key==="dl"){ const step=e.inc||1; const n=Math.round(kg*0.8/step)*step; return {kg:n, why:lastTxt+"Εβδομάδα αποφόρτισης: 20% λιγότερα κιλά."}; }
  if(e.bw) return {kg, why:lastTxt+(allTop?"Έβγαλες όλες τις επαναλήψεις: πρόσθεσε 2,5 kg ή 1 επανάληψη.":"Ίδιο βάρος, κυνήγα +1 επανάληψη.")};
  if(tooHeavy) return {kg:Math.max(0,kg-e.inc), why:lastTxt+"Ήταν βαρύ, κατεβαίνουμε λίγο για καθαρές επαναλήψεις."};
  if(allTop) return {kg:kg+e.inc, why:lastTxt+"Έπιασες το πάνω όριο σε όλα τα σετ, οπότε ανεβαίνουμε."};
  return {kg, why:lastTxt+"Ίδια κιλά, στόχος "+r.hi+" επαναλήψεις σε κάθε σετ."};
}

function nextDay(){
  const ps=programSessions().filter(s=>ROT.includes(s.day));
  if(!ps.length) return "A";
  const last=ps[ps.length-1].day; return ROT[(ROT.indexOf(last)+1)%4];
}
function bestFor(exId, beforeId){
  let best=null;
  for(const s of sessionsList()){ if(s.id===beforeId) continue; const arr=(s.entries||{})[exId]; if(!arr) continue;
    for(const x of arr){ if(!x.done) continue; const v=e1rm(x.kg,x.reps); if(v!=null && (!best||v>best.v)) best={v,kg:x.kg,reps:x.reps,date:s.date}; } }
  return best;
}
function todaysSessionId(){
  const ids=Object.keys(state.sessions).filter(id=>state.sessions[id].date===TODAY);
  return ids.length? ids.sort((a,b)=>(state.sessions[b].updatedAt||0)-(state.sessions[a].updatedAt||0))[0] : null;
}
function ensureSession(day){
  const id=TODAY+"_"+day;
  if(!state.sessions[id]) state.sessions[id]={date:TODAY, day, week:weekOf(TODAY), entries:{}, done:false, back:null, note:""};
  return id;
}

function plateHTML(ph){return '<span class="plate c-'+ph.color+'"><i></i><span>'+esc(ph.name)+'</span></span>';}

function exDone(exId, sess, week){
  const e=EX[exId]; const arr=(sess&&sess.entries&&sess.entries[exId])||[];
  if(e.type==="core"||e.type==="cond") return !!(arr[0]&&arr[0].done);
  const r=rxFor(exId,week); return arr.filter(x=>x.done).length>=r.sets;
}

function exCard(exId, week, sid, sess){
  const e=EX[exId]; if(!e) return "";
  const open = state.open===exId, done=exDone(exId,sess,week);
  const fr=frames(exId);
  const simple = e.type==="core"||e.type==="cond";
  const r = simple? null : rxFor(exId,week);
  const sg = simple? null : suggestion(exId,week,sid);
  const reps = r? (r.lo===r.hi? r.lo : r.lo+"–"+r.hi) : "";
  const sub = done? '<span class="ok">✓ Έγινε</span>' : simple? esc(e.type==="cond"?"10 λεπτά":e.text.split("·")[0].split(",")[0]) : r.sets+" × "+reps+(sg&&sg.kg!=null?" · <b>"+esc(fmtW(exId,sg.kg).replace(" ανά αλτήρα",""))+"</b>":"");
  let h='<section class="card ex'+(open?" open":"")+(done?" isdone":"")+'" data-ex="'+exId+'"><button type="button" class="exbtn" data-open="'+exId+'" aria-expanded="'+open+'">'+(fr[0]?pic(fr[0][0],"thumb"):'')+'<span class="exttl"><span class="ex-name">'+esc(e.name)+'</span><span class="exsub">'+sub+'</span></span><span class="chev" aria-hidden="true"></span></button>';
  if(!open) return h+'</section>';
  h+='<div class="exbody"><div class="frames'+(fr.length>2?" three":"")+'">'+fr.map(f=>'<figure>'+pic(f[0])+'<figcaption>'+esc(f[1])+'</figcaption></figure>').join("")+'</div>';
  if(simple){
    const text = e.type==="cond"? condText(week) : e.text;
    h+='<div class="target"><div class="big">'+esc(text)+'</div></div><p class="cue">'+esc(e.cue)+'</p>'+(e.back?'<p class="backtip">Για τη μέση: '+esc(e.back)+'</p>':'');
    h+='<button type="button" class="btn'+(done?" ghost":"")+'" data-simple="'+exId+'">'+(done?"Έγινε ✓ (πάτα για αναίρεση)":"Το έκανα ✓")+'</button>';
  } else {
    const arr=(sess&&sess.entries&&sess.entries[exId])||[];
    const n=Math.max(r.sets, arr.length);
    const rest = r.rest>=120? String(Math.round(r.rest/60*10)/10).replace(".",",")+" λεπτά" : r.rest+"''";
    h+='<div class="target"><div class="eyebrow">Βάλε</div><div class="big">'+esc(sg&&sg.kg!=null?fmtW(exId,sg.kg):"Δικά σου κιλά")+'</div><div class="tline"><b>'+r.sets+' σετ × '+reps+' επαναλήψεις</b> · ξεκούραση '+rest+(r.note?" · "+esc(r.note):"")+'</div>'+(sg?'<p class="why">'+esc(sg.why)+'</p>':'')+'</div>';
    let rows='';
    for(let i=0;i<n;i++){
      const x=arr[i]||{};
      rows+='<div class="set'+(x.done?" done":"")+'"><span class="sn num">'+(i+1)+'</span><input inputmode="decimal" aria-label="Κιλά σετ '+(i+1)+'" data-ex="'+exId+'" data-i="'+i+'" data-f="kg" value="'+(x.kg==null?"":fmtKg(x.kg))+'" placeholder="'+(sg&&sg.kg!=null?fmtKg(sg.kg):"kg")+'"><input inputmode="numeric" aria-label="Επαναλήψεις σετ '+(i+1)+'" data-ex="'+exId+'" data-i="'+i+'" data-f="reps" value="'+(x.reps==null?"":x.reps)+'" placeholder="'+r.hi+'"><button type="button" class="tick" data-tick="'+exId+'" data-i="'+i+'" aria-pressed="'+(!!x.done)+'" aria-label="Ολοκλήρωση σετ '+(i+1)+'">✓</button></div>';
    }
    h+='<div class="colhdr"><span></span><span>kg</span><span>επαν.</span><span></span></div><div class="sets">'+rows+'</div><p class="hint">Γράψε ό,τι έκανες και πάτα ✓. Αν αφήσεις κενό, μπαίνει η πρόταση.</p><button type="button" class="addset" data-add="'+exId+'">+ ένα σετ ακόμα</button>';
    h+='<div class="how"><p><strong>Πώς:</strong> '+esc(e.cue)+'</p><p><strong>Ένταση:</strong> σταμάτα κάθε σετ όταν νιώθεις ότι θα έβγαζες ακόμα ~'+esc(r.rir)+' επαναλήψεις.</p>'+(e.back?'<p class="backtip"><strong>Μέση:</strong> '+esc(e.back)+'</p>':'')+'</div>';
  }
  h+='<div class="exfoot"><a href="'+yt(e.en)+'" target="_blank" rel="noopener">Βίντεο τεχνικής ↗</a><button type="button" class="btn ghost sm" data-next="'+exId+'">Επόμενη άσκηση →</button></div></div></section>';
  return h;
}

function lineChart(points, unit){
  if(points.length<2) return '<div class="empty">Χρειάζονται τουλάχιστον 2 καταγραφές για γράφημα. '+(points.length?'Τώρα: '+fmtKg(points[0].y)+' '+unit+'.':'')+'</div>';
  const W=340,H=170,L=38,R=14,T=14,B=26;
  const ys=points.map(p=>p.y); let mn=Math.min(...ys), mx=Math.max(...ys); if(mn===mx){mn-=1;mx+=1;} const pad=(mx-mn)*0.12; mn-=pad; mx+=pad;
  const d0=points[0].x, dN=points[points.length-1].x; const span=Math.max(1,daysBetween(d0,dN));
  const X=x=>L+(W-L-R)*daysBetween(d0,x)/span, Y=y=>T+(H-T-B)*(1-(y-mn)/(mx-mn));
  const path=points.map((p,i)=>(i?"L":"M")+X(p.x).toFixed(1)+" "+Y(p.y).toFixed(1)).join(" ");
  const area=path+" L"+X(dN).toFixed(1)+" "+(H-B)+" L"+X(d0).toFixed(1)+" "+(H-B)+" Z";
  const lo=Math.min(...ys), hi=Math.max(...ys);
  const grid=[lo,hi].filter((v,i,a)=>a.indexOf(v)===i).map(v=>'<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'" stroke="var(--line)" stroke-dasharray="3 3"/><text x="'+(L-6)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+fmtKg(v)+'</text>').join("");
  const last=points[points.length-1];
  const dots=points.map(p=>'<circle cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="3" fill="var(--card)" stroke="var(--accent)" stroke-width="2"/>').join("");
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Γράφημα προόδου"><path d="'+area+'" fill="var(--accent)" fill-opacity=".1"/>'+grid+'<path d="'+path+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>'+dots+'<circle cx="'+X(last.x).toFixed(1)+'" cy="'+Y(last.y).toFixed(1)+'" r="5" fill="var(--accent)"/><text x="'+L+'" y="'+(H-6)+'" font-size="11" fill="var(--muted)">'+esc(fmtDate(d0))+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" font-size="11" text-anchor="end" fill="var(--muted)">'+esc(fmtDate(dN))+'</text></svg>';
}
function seriesFor(exId){
  const pts=[];
  for(const s of sessionsList()){ const arr=((s.entries||{})[exId]||[]).filter(x=>x.done&&x.kg!=null); if(!arr.length) continue; pts.push({x:s.date,y:Math.max(...arr.map(x=>x.kg))}); }
  const m={}; pts.forEach(p=>{m[p.x]=Math.max(m[p.x]==null?-1e9:m[p.x],p.y);}); return Object.keys(m).sort().map(x=>({x,y:m[x]}));
}
function viewProgress(){
  const ps=programSessions(); const wk=weekOf(TODAY);
  const thisWeek=ps.filter(s=>weekOf(s.date)===wk).length;
  const mains=Object.keys(EX).filter(k=>EX[k].type==="main"&&!EX[k].bw);

function tab(){const h=(location.hash||"").replace("#","");return ["today","plan","progress","food","back"].includes(h)?h:"today";}
function render(){
  const t=tab(); const wk=weekOf(TODAY), ph=phaseOf(wk);
  $("#hdrPlate").innerHTML=plateHTML(ph);

function rerenderCard(exId){
  const old=document.querySelector('.ex[data-ex="'+exId+'"]'); if(!old) return render();
  if(tab()==="today"){ const sy=window.scrollY; render(); window.scrollTo(0,sy); return; }
  const day=state.sel, sid=TODAY+"_"+day; const tmp=document.createElement("div");
  tmp.innerHTML=exCard(exId, weekOf(TODAY), sid, state.sessions[sid]); old.replaceWith(tmp.firstElementChild);
}
function parseNum(v){if(v==null)return null;v=String(v).trim().replace(",",".");if(v==="")return null;const n=Number(v);return isFinite(n)?n:null;}
function getEntry(exId,i){const sid=ensureSession(state.sel);const s=state.sessions[sid];s.entries=s.entries||{};const arr=s.entries[exId]=s.entries[exId]||[];while(arr.length<=i)arr.push({kg:null,reps:null,done:false});return {sid,s,arr,x:arr[i]};}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{t.hidden=true;},3200);}
let restTimer=null;
/* ---------- Rest timer sound (Web Audio, unlocked on the first tap) ---------- */
let actx=null;
function unlockAudio(){
  try{
    if(navigator.audioSession){ try{ navigator.audioSession.type="transient"; }catch(e){} }
    if(!actx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return; actx=new C(); }
    if(actx.state==="suspended") actx.resume();
    if(!unlockAudio.done){ const o=actx.createOscillator(),g=actx.createGain(); g.gain.value=0.0001; o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+0.02); unlockAudio.done=true; }
  }catch(e){}
}
function beep(freq,dur,when,vol){
  if(!actx) return; try{
    const t=actx.currentTime+(when||0), o=actx.createOscillator(), g=actx.createGain();
    o.type="square"; o.frequency.value=freq; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.35,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+dur+0.02);
  }catch(e){}
}
function vib(p){ try{ navigator.vibrate&&navigator.vibrate(p); }catch(e){} }
function startRest(sec){
  unlockAudio(); ensureAwake(true);
  state.restEnd=Date.now()+sec*1000; $("#rest").hidden=false; clearInterval(restTimer);
  let lastLeft=null;
  const tick=()=>{
    const left=Math.max(0,Math.ceil((state.restEnd-Date.now())/1000));
    $("#restTxt").textContent=left>0?"Διάλειμμα "+Math.floor(left/60)+":"+String(left%60).padStart(2,"0"):"Πάμε, επόμενο σετ!";
    if(left!==lastLeft){
      if(left>0 && left<=3){ beep(880,0.12,0,0.25); vib(80); }
      if(left===0){ if(actx&&actx.state==="suspended") actx.resume(); beep(1320,0.25,0); beep(1320,0.25,0.35); beep(1760,0.5,0.7); vib([300,120,300,120,500]); }
      lastLeft=left;
    }
    if(left<=0){ clearInterval(restTimer); setTimeout(()=>{$("#rest").hidden=true;},5000); }
  };
  tick(); restTimer=setInterval(tick,250);
}
$("#restSkip").addEventListener("click",()=>{clearInterval(restTimer);$("#rest").hidden=true;});

document.addEventListener("click",ev=>{
  const b=ev.target.closest("button"); if(!b) return;
  if(b.dataset.day){state.sel=b.dataset.day;state.open=null;render();window.scrollTo(0,0);return;}
  if(b.dataset.open){const id=b.dataset.open;state.open=state.open===id?"":id;render();if(state.open){const el=document.querySelector('.ex[data-ex="'+id+'"]');if(el)el.scrollIntoView({block:"start",behavior:"smooth"});}return;}

  if(b.dataset.tick){
    const exId=b.dataset.tick,i=+b.dataset.i; const {sid,x}=getEntry(exId,i);
    const card=b.closest(".set"); const kgIn=card.querySelector('[data-f="kg"]'), rIn=card.querySelector('[data-f="reps"]');

      if(x.kg==null){const p=parseNum(kgIn.value||kgIn.placeholder); x.kg = p;}
      if(x.reps==null){const p=parseNum(rIn.value)||r.hi; x.reps=p;}
      const prev=bestFor(exId,sid); x.done=true;
      const v=e1rm(x.kg,x.reps);
      if(EX[exId].type==="main" && prev && v!=null && v>prev.v+0.01) toast("Νέο ρεκόρ: "+EX[exId].name+" "+fmtKg(x.kg)+" kg × "+x.reps);
      startRest(r.rest);
    } else x.done=false;
    persist(sid); rerenderCard(exId); return;
  }
  if(b.dataset.simple){const {sid,x}=getEntry(b.dataset.simple,0);x.done=!x.done;persist(sid);if(x.done){const D=DAYS[state.sel]||DAYS.A;state.open=D.ex[D.ex.indexOf(b.dataset.simple)+1]||"";}rerenderCard(b.dataset.simple);return;}
  if(b.dataset.add){const exId=b.dataset.add;const sid=ensureSession(state.sel);const s=state.sessions[sid];const arr=s.entries[exId]=s.entries[exId]||[];const r=rxFor(exId,weekOf(TODAY));while(arr.length<r.sets)arr.push({kg:null,reps:null,done:false});arr.push({kg:null,reps:null,done:false});persist(sid);rerenderCard(exId);return;}
  if(b.dataset.back!=null){const sid=ensureSession(state.sel);state.sessions[sid].back=+b.dataset.back;persist(sid);document.querySelectorAll("[data-back]").forEach(x=>x.setAttribute("aria-pressed",x===b));return;}
  if(b.id==="finish"){const sid=ensureSession(state.sel);const s=state.sessions[sid];s.done=true;s.note=($("#note")||{}).value||s.note;persist(sid);b.textContent="Ολοκληρώθηκε ✓";const n=programSessions().length;toast("Προπόνηση "+n+" από 48. Καλή δουλειά.");return;}
  if(b.id==="bkCopy"){const txt=JSON.stringify({v:1,start:state.start,sessions:state.sessions,body:state.body});const ta=$("#bkText");const done=()=>toast("Αντιγράφηκε. Επικόλλησέ το κάπου ασφαλές.");const fb=()=>{ta.value=txt;ta.focus();ta.select();toast("Το κείμενο είναι στο πλαίσιο: επίλεξέ το και αντίγραψέ το.");};try{navigator.clipboard.writeText(txt).then(done,fb);}catch(e){fb();}return;}
  if(b.id==="bkLoad"){let d=null;try{d=JSON.parse($("#bkText").value);}catch(e){}if(!d||typeof d.sessions!=="object"){toast("Αυτό το κείμενο δεν είναι έγκυρο αντίγραφο.");return;}let n=0;for(const id in d.sessions){const cur=state.sessions[id];const inc=d.sessions[id];if(!cur||(inc.updatedAt||0)>=(cur.updatedAt||0)){state.sessions[id]=inc;persist(id);n++;}}for(const dt in (d.body||{})){saveBody(dt,d.body[dt]);}lsSet("gym.sessions",state.sessions);render();toast("Επαναφέρθηκαν "+n+" προπονήσεις.");return;}
  if(b.id==="saveBody"){const w=parseNum($("#bw").value), c=parseNum($("#waist").value);if(w==null&&c==null){toast("Γράψε βάρος ή μέση πρώτα");return;}const o={};if(w!=null)o.weight=w;if(c!=null)o.waist=c;saveBody(TODAY,o);render();toast("Καταγράφηκε");return;}
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.dataset && t.dataset.f){const {sid,x}=getEntry(t.dataset.ex,+t.dataset.i);x[t.dataset.f]=parseNum(t.value);persist(sid);return;}

function safeRender(){const a=document.activeElement; if(tab()==="today" && a && (a.tagName==="INPUT"||a.tagName==="TEXTAREA")) return; render();}

/* ---------- Boot ---------- */
state.sessions=lsGet("gym.sessions",{}); state.body=lsGet("gym.body",{});
render();
/* ---------- Keep screen awake while the page is open ---------- */
/* Two methods at once: the Wake Lock API where the viewer allows it, plus a tiny looping video
   (the classic fallback for iOS/older browsers). Both are re-armed on every tap and when the page becomes visible. */
const wake={lock:null, video:false, want:true, tried:false};
function wakeUI(){
  const on=!!wake.lock||wake.video; const b=$("#wake");
  b.setAttribute("aria-pressed",String(on));
  b.textContent = !wake.want? "Οθόνη: κανονική" : on? "Οθόνη ανοιχτή" : wake.tried? "Οθόνη: πάτα εδώ" : "Οθόνη: άγγιξε τη σελίδα";
}
async function lockApi(){
  if(wake.lock || !("wakeLock" in navigator)) return;
  try{ wake.lock=await navigator.wakeLock.request("screen"); wake.lock.addEventListener("release",()=>{wake.lock=null;wakeUI();}); }catch(e){ wake.lock=null; }
}
async function lockVideo(){
  const v=$("#nosleep"); if(!v) return;
  try{ v.muted=true; v.setAttribute("muted",""); v.setAttribute("playsinline",""); v.setAttribute("webkit-playsinline",""); if(v.paused) await v.play(); wake.video=!v.paused; }catch(e){ wake.video=false; }
}
async function ensureAwake(fromTap){
  if(!wake.want||document.visibilityState!=="visible") return;
  await lockApi();
  if(fromTap){ wake.tried=true; await lockVideo(); }
  wakeUI();
}
const nsv=$("#nosleep");
if(nsv){ nsv.addEventListener("pause",()=>{ wake.video=false; wakeUI(); }); nsv.addEventListener("playing",()=>{ wake.video=true; wakeUI(); });
  /* keep the loop alive: some browsers stop a looping clip at its end */
  nsv.addEventListener("timeupdate",()=>{ if(nsv.duration && nsv.currentTime>nsv.duration-0.5) nsv.currentTime=0; }); }
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ wake.video=false; ensureAwake(false); } });
["pointerdown","touchend","click"].forEach(t=>document.addEventListener(t,()=>{ unlockAudio(); if(!wake.lock||!wake.video) ensureAwake(true); },{passive:true}));
$("#wake").addEventListener("click",async ev=>{
  ev.stopPropagation();
  if(wake.want && (wake.lock||wake.video)){ wake.want=false; try{wake.lock&&await wake.lock.release();}catch(e){} wake.lock=null; try{$("#nosleep").pause();}catch(e){} wake.video=false; wakeUI(); }
  else { wake.want=true; ensureAwake(true); }
});
setInterval(()=>{ if(wake.want && document.visibilityState==="visible" && !wake.lock) lockApi().then(wakeUI); },15000);
ensureAwake(false);
if(STANDALONE && "serviceWorker" in navigator && location.protocol==="https:"){ try{ navigator.serviceWorker.register("sw.js"); }catch(e){} }
(async function(){
  let api=null;
  try{ api = window.claude && window.claude.use ? await window.claude.use("db") : null; }catch(e){ api=null; }
  if(!api){ state.mode="local"; setStatus(); render(); return; }
  db=api; state.mode="db"; let gotFirst=false;
  const to=setTimeout(()=>{ if(!gotFirst) setStatus("Δεν φτάνω ακόμα τα αποθηκευμένα δεδομένα. Ό,τι γράφεις κρατιέται και θα συγχρονιστεί."); },10000);
  try{ db.doc("config/main").get().then(s=>{ if(s.exists && s.data().start){ state.start=s.data().start; safeRender(); } }).catch(()=>{}); }catch(e){}
  db.collection("sessions").onSnapshot(snap=>{
    if(!snap.metadata.fromCache){gotFirst=true;clearTimeout(to);setStatus();}
    const next={};
    snap.docs.forEach(d=>{ next[d.id]=JSON.parse(JSON.stringify(d.data())); });
    for(const id of dirty){ if(state.sessions[id]) next[id]=state.sessions[id]; }
    // keep local-only sessions not yet written
    for(const id in state.sessions){ if(!next[id] && dirty.has(id)) next[id]=state.sessions[id]; }
    state.sessions=next; lsSet("gym.sessions",state.sessions); safeRender();
  }, err=>{ clearTimeout(to); setStatus("Δεν συνδέθηκα στα δεδομένα ("+(err&&err.code||"σφάλμα")+"). Κρατάω τις καταγραφές σε αυτή τη συσκευή."); db=null; state.mode="local"; });
  db.collection("body").onSnapshot(snap=>{ const nb={}; snap.docs.forEach(d=>{nb[d.id]=JSON.parse(JSON.stringify(d.data()));}); state.body=Object.assign({}, state.body, nb); safeRender(); }, ()=>{});
})();
})();
